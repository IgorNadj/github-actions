name: 'Build and Push'
description: 'Docker build and push'

#  This action builds and pushes a Docker image tagged `latest` and only runs on the `main` branch.
#
#  Setup for underlying repo
#
#  1. Store DOCKERHUB_TOKEN in action secrets
#  2. Add the following action:
#
#  ```yaml
#  jobs:
#    build:
#      runs-on: ubuntu-24.04-arm
#      steps:
#        - name: Checkout code
#          uses: actions/checkout@v4
#
#        - name: Build and Push
#          uses: IgorNadj/github-actions/build-and-push@main
#          with:
#            dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
#  ```


# Define the inputs the action will accept
inputs:
  dockerhub-token:
    description: 'Dockerhub token'
    required: true

runs:
  using: "composite"
  steps:
    - name: Ensure main branch
      if: ${{ github.ref != 'refs/heads/main' }}
      shell: bash
      run: |
        echo "This action only runs on main. Current ref: $GITHUB_REF"
        exit 1

    - name: Extract Docker image metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ github.repository }}
        tags: |
          type=raw,value=latest

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: igornadj
        password: ${{ inputs.dockerhub-token }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' }}
        platforms: linux/arm64
        tags: ${{ steps.meta.outputs.tags }}
        annotations: ${{ steps.meta.outputs.annotations }}
