name: 'SSH Docker Compose Deploy'
description: 'Connects to a server via SSH and runs git pull and docker compose up.'

#  This action deploys to dev-webserver
#
#  Setup for underlying repo
#
#  1. Store DEV_SERVER_SSH_KEY in action secrets
#  2. Add the following action:
#
#  ```yaml
#  name: Deploy to Dev Server
#
#  on:
#    workflow_run:
#      workflows: ["build"]
#      types:
#        - completed
#      branches:
#        - main
#
#  jobs:
#    deploy:
#      runs-on: ubuntu-latest
#      # This condition ensures the job only runs if the triggering workflow was successful
#      if: github.event.workflow_run.conclusion == 'success'
#      steps:
#        - name: Checkout code
#          uses: actions/checkout@v4
#
#        - name: Deploy
#          uses: IgorNadj/github-actions/deploy@main
#          with:
#            ssh-private-key: ${{ secrets.DEV_SERVER_SSH_KEY }}

#  ```


# Define the inputs the action will accept
inputs:
  ssh-private-key:
    description: 'The private SSH key for authentication'
    required: true

runs:
  using: "composite"
  steps:
    - name: Deploy to server
      shell: bash
      run: |
        # debug flags
        set -xe
        
        # Start the SSH agent and add the private key
        eval "$(ssh-agent -s)"
        echo "${{ inputs.ssh-private-key }}" | ssh-add - > /dev/null

        # Create the SSH directory and add the server's host key to known_hosts
        mkdir -p ~/.ssh
        ssh-keyscan -H "ec2-16-26-156-40.ap-southeast-4.compute.amazonaws.com" >> ~/.ssh/known_hosts

        # Execute the deployment commands on the remote server
        ssh ubuntu@ec2-16-26-156-40.ap-southeast-4.compute.amazonaws.com << 'EOF'
          set -e;
        
          cd /home/ubuntu/dev-webserver
          git pull
        
          # Log in to Docker Hub using the secret token
          cat /home/ubuntu/.docker-hub-secret | docker login -u igornadj --password-stdin
        
          # Run docker-compose commands
          docker image prune --force
          docker compose pull --quiet
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
        EOF
